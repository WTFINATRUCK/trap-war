services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trap_wars
      POSTGRES_USER: trap_wars
      POSTGRES_PASSWORD: trap_wars_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trap_wars -d trap_wars"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - trap_wars_postgres:/var/lib/postgresql/data

volumes:
  trap_wars_postgres:
