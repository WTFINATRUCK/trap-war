<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trap Wars | Play</title><link rel="stylesheet" href="TemplateData/style.css"></head><body><main id="shell"><canvas id="unity-canvas" tabindex="-1"></canvas><section id="loader" aria-live="polite"><div class="mark">TRAP WARS</div><p id="status">Loading the safehouse</p><div class="track"><div id="progress"></div></div><strong id="percent">0%</strong></section><aside id="error" hidden><strong>THE CONNECTION DROPPED</strong><p id="error-copy">Reload the demo and try again.</p><button onclick="location.reload()">RELOAD</button></aside><button id="fullscreen" hidden>FULLSCREEN</button></main><script>
const canvas=document.querySelector('#unity-canvas'),loader=document.querySelector('#loader'),progress=document.querySelector('#progress'),percent=document.querySelector('#percent'),status=document.querySelector('#status'),error=document.querySelector('#error'),errorCopy=document.querySelector('#error-copy'),fullscreen=document.querySelector('#fullscreen');const buildUrl='Build';const config={dataUrl:buildUrl+'/game.data.unityweb',frameworkUrl:buildUrl+'/game.framework.js.unityweb',codeUrl:buildUrl+'/game.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:"Trap Wars Studio",productName:"Trap Wars",productVersion:"0.8.4",showBanner:(message,type)=>{if(type==='error')fail(message)}};const fail=message=>{loader.hidden=true;error.hidden=false;errorCopy.textContent=message||'Reload the demo and try again.'};const script=document.createElement('script');script.src=buildUrl+'/game.loader.js';script.onload=()=>createUnityInstance(canvas,config,value=>{const amount=Math.round(value*100);progress.style.width=amount+'%';percent.textContent=amount+'%';status.textContent=amount<35?'Loading the safehouse':amount<75?'Connecting the streets':'Getting your first move ready'}).then(instance=>{loader.hidden=true;fullscreen.hidden=false;fullscreen.onclick=()=>instance.SetFullscreen(1)}).catch(value=>fail(value.message));script.onerror=()=>fail('The game files could not be loaded. Reload and try again.');document.body.appendChild(script);
</script></body></html>
